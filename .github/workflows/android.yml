
name: Build Masrofati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MasrofatiAndroid_Project_fixed(2).zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP_FILE="./MasrofatiAndroid_Project_fixed(2).zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Project ZIP not found: $ZIP_FILE"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d .

          if [ ! -f "MasrofatiAndroid/settings.gradle" ]; then
            echo "Android project structure not found"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon --stacktrace -p MasrofatiAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masrofati-APK
          path: MasrofatiAndroid/app/build/outputs/apk/debug/app-debug.apk
